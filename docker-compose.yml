version: "3.8"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-6}
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: hragent
      POSTGRES_PASSWORD: hrpass
      POSTGRES_DB: hragent
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data: {}